name: Waka Readme

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          LOCALE: pt
          COMMIT_MESSAGE: "chore(stats): update WakaTime metrics and custom theme"
          BAR_STYLE: "solid"
          BAR_COLOR: "#82AAFF"
          BAR_TRACK_COLOR: "#1a2230"
          BAR_RADIUS: "4"
          TEXT_PRIMARY_COLOR: "#c9d1d9"
          TEXT_SECONDARY_COLOR: "#8b949e"
          SHOW_TIME: "True"
          SHOW_SHORT_INFO: "True"
          SHOW_TOTAL_CODE_TIME: "True"
          SHOW_LOC_CHART: "True"
          SHOW_PROJECTS: "False"
          SHOW_TIMEZONE: "False"
          SHOW_PROFILE_VIEWS: "False"
          SHOW_OS: "False"
          SHOW_LANGUAGE_PER_REPO: "False"
