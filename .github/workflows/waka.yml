name: Waka Readme

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    name: WakaReadme DevMetrics
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master
        with:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}

          ### Conteúdo e Formatação Visual
          SHOW_TITLE: true
          SECTION_NAME: waka
          TIME_RANGE: all_time
          LANG_COUNT: 10
          SHOW_TIME: true
          SHOW_TOTAL: true
          SHOW_MASKED_TIME: false
          STOP_AT_OTHER: false

          # Estilo do gráfico ASCII (ex: "░▒▓█", "⣀⣄⣤⣦⣶⣷⣿", "->", "-#")
          BLOCKS: "░▒▓█"

          # Ocultar linguagens/arquivos irrelevantes (separados por espaço)
          IGNORED_LANGUAGES: "YAML JSON TOML Markdown"

          ### Committer
          COMMIT_MESSAGE: "chore(stats): update WakaTime metrics"
