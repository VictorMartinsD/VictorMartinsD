name: Format README

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: profile-readme-commits
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Prettier
        run: npx --yes prettier@3.9.10 --write README.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "style(readme): auto-format README with Prettier"
          git pull --rebase
          git push
