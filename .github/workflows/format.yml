
name: Format README

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Prettier
        uses: creyD/prettier_action@v4.6
        with:
          prettier_options: '--write README.md'
          prettier_version: '3.9.10'
          commit_message: 'style(readme): auto-format README with Prettier'
          file_pattern: 'README.md'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_identity: actions
