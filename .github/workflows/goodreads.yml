name: Update Goodreads Bookshelf

on:
  schedule:
    - cron: "0 0 * * *" # Executa automaticamente 1x por dia
  workflow_dispatch: # Permite rodar manualmente no painel do GitHub

permissions:
  contents: write # Permissão necessária para fazer commit no README

jobs:
  update-readme-books:
    name: Update README with Goodreads Shelves
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # 1. LENDO ATUALMENTE
      - name: Fetch Currently Reading
        uses: zwacky/goodreads-profile-workflow@main
        with:
          goodreads_user_id: "205640656"
          shelf: "currently-reading"
          comment_tag_name: "GOODREADS-CURRENTLY-READING"
          max_books_count: "3"
          sort_by_fields: ">user_date_added"
          template: '<sub>• <a href="$url"><b>$title</b></a> - <i>$author</i></sub>'

      # 2. LIVROS LIDOS
      - name: Fetch Read Books
        uses: zwacky/goodreads-profile-workflow@main
        with:
          goodreads_user_id: "205640656"
          shelf: "read"
          comment_tag_name: "GOODREADS-READ"
          max_books_count: "3"
          sort_by_fields: ">user_read_at"
          template: '<sub>• <a href="$url"><b>$title</b></a> - <i>$author</i><br />&nbsp;&nbsp;Minha nota: $my_rating_stars &nbsp;|&nbsp; Média: ⭐️ $average_rating</sub>'

      # 3. QUERO LER
      - name: Fetch To Read Books
        uses: zwacky/goodreads-profile-workflow@main
        with:
          goodreads_user_id: "205640656"
          shelf: "to-read"
          comment_tag_name: "GOODREADS-TO-READ"
          max_books_count: "3"
          sort_by_fields: ">user_date_added"
          template: '<sub>• <a href="$url"><b>$title</b></a> - <i>$author</i><br />&nbsp;&nbsp;Média: ⭐️ $average_rating</sub>'

      # 4. COMMIT DAS ALTERAÇÕES NO README
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "docs: update Goodreads bookshelf in README"
