name: Atualizar data do perfil

on:
  push:
    paths:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Gerar SVG da data
        run: |
          mkdir -p assets
          MESES=(Janeiro Fevereiro Março Abril Maio Junho Julho Agosto Setembro Outubro Novembro Dezembro)
          
          # Captura dia, mês, ano e hora no fuso do Brasil
          DIA=$(TZ=America/Sao_Paulo date +%-d)
          MES=$(TZ=America/Sao_Paulo date +%-m)
          ANO=$(TZ=America/Sao_Paulo date +%Y)
          HORA=$(TZ=America/Sao_Paulo date +%Hh%M)
          
          # Regra gramatical: adiciona 'º' apenas se for dia 1
          if [ "$DIA" -eq 1 ]; then
            DIA_TXT="1º"
          else
            DIA_TXT="$DIA"
          fi
          
          TEXTO="Atualizado em $DIA_TXT de ${MESES[$((MES-1))]} de $ANO às $HORA"
          
          cat > assets/updated.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="320" height="24">
            <text x="160" y="16" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4A90E2">$TEXTO</text>
          </svg>
          EOF

      - name: Commit como bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/updated.svg
          git diff --cached --quiet || (git commit -m "chore(profile): update timestamp in SVG on README commit" && git pull --rebase && git push)
