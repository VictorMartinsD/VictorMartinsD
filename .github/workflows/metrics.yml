# Referência completa: https://github.com/lowlighter/metrics#-documentation
name: Metrics

on:
  schedule:
    - cron: "47 11 * * *" # todo dia às 11:47 UTC (08:47 em Brasília)
  workflow_dispatch: # Permite rodar manualmente pela aba Actions do GitHub

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Token pessoal (clássico) com os escopos: public_repo, read:org,
          # read:packages, read:project, read:user e repo:status
          token: ${{ secrets.METRICS_TOKEN }}

          # Conta e aparência
          user: VictorMartinsD
          template: classic
          base: header
          base_hireable: yes
          config_display: regular
          config_timezone: America/Sao_Paulo
          config_output: svg
          committer_message: "chore(stats): update GitHub metrics"

          # Linguagens mais usadas
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_other: yes
          plugin_languages_threshold: 0%
          
          # Modo de diagnóstico
          debug: yes
