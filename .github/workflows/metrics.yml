# Referência completa: https://github.com/lowlighter/metrics#-documentation
name: Metrics

on:
  schedule:
    - cron: "47 11 * * *" # todo dia às 11:47 UTC (08:47 em Brasília)
  workflow_dispatch: # Permite rodar manualmente pela aba Actions do GitHub

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Conta e aparência
          user: VictorMartinsD
          template: terminal
          base: header
          base_hireable: yes
          base_indepth: no
          config_timezone: America/Sao_Paulo
          config_output: svg
          config_animations: no
          config_padding: 0, 8 + 0%
          committer_message: "chore(stats): update GitHub metrics"

          # Modo de diagnóstico
          debug: yes
